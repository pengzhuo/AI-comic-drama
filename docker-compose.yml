# DramaClaw CE — 源码构建（默认入口）：api、web 用本地 checkout 构建，网关用旁边的 dramaclaw-gateway checkout 构建，三件全部本地产出。
#   git clone https://github.com/dramaclaw/dramaclaw-gateway.git ../dramaclaw-gateway
#   cp .env.example .env && docker compose up -d --build
# 运行定义（env / 端口 / 卷 / 健康检查）全部 extends 自 docker-compose.release.yml，这里增加 build、本地镜像名与源码运行时覆盖。
# 只想拉已发布镜像：docker compose -f docker-compose.release.yml up -d
# 网关源码默认取 ../dramaclaw-gateway（与本仓并排的 clone，改代码直接改那里）；放在别处或想让 Docker 直接从 git 拉：
#   .env 设 DRAMACLAW_GATEWAY_SRC=<路径> 或 DRAMACLAW_GATEWAY_SRC=https://github.com/dramaclaw/dramaclaw-gateway.git#main
# 本地构建的镜像命名为 dramaclaw-local/*，不会覆盖本机缓存里的 claymorelab/* 发布镜像。
services:
  api:
    extends:
      file: docker-compose.release.yml
      service: api
    image: dramaclaw-local/api
    # Source images include the pinned Codex runtime and the reviewed Hermes fork.
    environment:
      DRAMACLAW_CHAT_BACKEND: "${DRAMACLAW_CHAT_BACKEND:-codex}"
      HERMES_CLI_PATH: "${HERMES_CLI_PATH:-/usr/local/bin/hermes}"
    build:
      context: .
      dockerfile: Dockerfile
      # 默认精简镜像。要 3DGS/SHARP「world」特性（torch/gsplat/sharp/da2 + SOG 工具）：
      #   INSTALL_WORLD=1 docker compose up -d --build
      # 注：权重运行时下载不入镜像；slim base 为 CPU，GPU 加速需 CUDA base；Mac Docker 无 GPU。
      args:
        INSTALL_WORLD: "${INSTALL_WORLD:-0}"
        # Keep the reviewed Hermes fork available for explicit fallback.
        HERMES_REPO: "${HERMES_REPO:-https://github.com/dramaclaw/hermes-agent.git}"
        HERMES_REF: "${HERMES_REF:-brainclaw/evidence-plane}"
        # 可选：构建期镜像源（默认官方源）。国内构建建议设 APT_MIRROR=mirrors.aliyun.com。
        APT_MIRROR: "${APT_MIRROR:-}"
        # 可选：构建期 PyPI 镜像（默认官方源）。国内构建建议设
        # PYPI_MIRROR=https://mirrors.aliyun.com/pypi/simple/。
        PYPI_MIRROR: "${PYPI_MIRROR:-}"
  newapi:
    extends:
      file: docker-compose.release.yml
      service: newapi
    image: dramaclaw-local/gateway
    build:
      context: ${DRAMACLAW_GATEWAY_SRC:-../dramaclaw-gateway}
      dockerfile: Dockerfile
  web:
    extends:
      file: docker-compose.release.yml
      service: web
    image: dramaclaw-local/web
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 可选：构建期 npm 镜像（默认官方 registry）。国内构建建议设
        # NPM_REGISTRY=https://registry.npmmirror.com。
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
        # CE 回退版本；未设时保持 Dockerfile 的默认（ce）。
        VITE_EDITION: "${VITE_EDITION-ce}"
        # 实例级构建期配置（默认空 = 官方原样）。这些值会被写进产物，所以必须经
        # build args 传进来：`.dockerignore` 排除了 `.env.*`，镜像里读不到
        # `.env.ce.local`。见 frontend/Dockerfile 的 ARG 段与
        # docs/agents/web-hotpatch-deploy.md §1/§6；`pnpm verify:ce` 会在构建末尾
        # 断言产物确实带上了这些值。
        VITE_HIDE_RELEASE_POPUP: "${VITE_HIDE_RELEASE_POPUP:-}"
        VITE_HIDE_PIKO_ENTRY: "${VITE_HIDE_PIKO_ENTRY:-}"
        VITE_HIDE_OFFICIAL_CHANNELS: "${VITE_HIDE_OFFICIAL_CHANNELS:-}"
        VITE_HIDE_NOTIFICATION_CENTER: "${VITE_HIDE_NOTIFICATION_CENTER:-}"
        VITE_HIDE_MODEL_GUIDE: "${VITE_HIDE_MODEL_GUIDE:-}"
        VITE_HIDE_GITHUB_STARS: "${VITE_HIDE_GITHUB_STARS:-}"
        VITE_HIDE_HEADER_SETTINGS: "${VITE_HIDE_HEADER_SETTINGS:-}"
        VITE_LOGIN_ANNOUNCEMENTS_URL: "${VITE_LOGIN_ANNOUNCEMENTS_URL:-}"
        VITE_INTERNAL_ENTRY_PATH: "${VITE_INTERNAL_ENTRY_PATH:-}"
        VITE_BRAND_ATTRIBUTION: "${VITE_BRAND_ATTRIBUTION:-}"
        # 实例镜像开启严格校验：整组实例键必须齐全，缺任何一个就构建失败。
        # 见 frontend/scripts/verify-ce-bundle.mjs 与 docs/agents/web-hotpatch-deploy.md §1。
        VITE_REQUIRE_INSTANCE_CONFIG: "${VITE_REQUIRE_INSTANCE_CONFIG:-}"

# extends 不带顶层 volumes，需在此重申（名字与 release 文件一致，数据卷共用）。
volumes:
  ce-data:
  newapi-data:
